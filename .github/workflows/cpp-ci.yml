name: C++ Student Management System CI

# When should the pipeline execute?
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  # Allows us to run the pipeline manually
  workflow_dispatch:

# Minimum permissions required
permissions:
  contents: read

jobs:
  build-and-test:
    # GitHub provides a Windows virtual machine
    runs-on: windows-latest

    # Execute commands inside MSYS2 UCRT64
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # Step 1: Download project source code
      - name: Checkout source code
        uses: actions/checkout@v5

      # Step 2: Configure MSYS2 UCRT64
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      # Step 3: Verify compiler and build tools
      - name: Check build tools
        run: |
          g++ --version
          cmake --version
          mingw32-make --version

      # Step 4: Configure CMake
      - name: Configure project
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DBUILD_TESTING=ON

      # Step 5: Compile application and test executable
      - name: Build project
        run: |
          cmake --build build --parallel

      # Step 6: Execute GoogleTest cases through CTest
      - name: Run unit tests
        run: |
          ctest --test-dir build --output-on-failure
